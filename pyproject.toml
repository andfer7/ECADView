[project]
name = "pcbvisualizer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altium-monkey>=2026.9.22",
    "freetype-py>=2.5.1",
    "numpy>=1.26,<3",
    "pyside6-addons>=6.8,<7",
    "pyside6-essentials>=6.8,<7",
    "sexpdata>=1.0.2,<2",
    "shapely>=2.1,<3",
]

[project.scripts]
pcbvisualizer = "pcbvisualizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcbvisualizer*"]

[tool.setuptools.package-data]
pcbvisualizer = ["static/*.html", "static/*.css", "static/*.js", "static/*.txt"]

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
